<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b18" />
      <stop offset="50%" stop-color="#19102c" />
      <stop offset="100%" stop-color="#001826" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ff8800" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded App Icon Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="104" fill="none" stroke="url(#neonCyan)" stroke-width="6" opacity="0.8" />

  <!-- Speed Trails / Tracks -->
  <path d="M 60 420 L 220 180 L 240 180 L 140 420 Z" fill="#00f0ff" opacity="0.3" />
  <path d="M 240 180 L 272 180 L 272 420 L 240 420 Z" fill="#ff007f" opacity="0.3" />
  <path d="M 272 180 L 292 180 L 452 420 L 372 420 Z" fill="#00f0ff" opacity="0.3" />

  <!-- Runner Silhouette Dynamic Action Pose -->
  <g filter="url(#glow)">
    <!-- Skateboard -->
    <ellipse cx="256" cy="370" rx="120" ry="18" fill="url(#neonCyan)" transform="rotate(-18 256 370)" />
    
    <!-- Torso and Limbs -->
    <!-- Front Leg -->
    <path d="M 230 280 L 290 320 L 320 360" stroke="#00f0ff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Back Leg -->
    <path d="M 220 280 L 170 320 L 190 360" stroke="#ff007f" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Torso -->
    <path d="M 240 180 L 220 280" stroke="#ffffff" stroke-width="32" stroke-linecap="round" fill="none" />
    <!-- Head with Visor -->
    <circle cx="250" cy="140" r="28" fill="#ffe600" />
    <path d="M 245 136 L 275 142" stroke="#00f0ff" stroke-width="8" stroke-linecap="round" />
    <!-- Front Arm -->
    <path d="M 240 200 L 300 210 L 340 180" stroke="#00f0ff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Back Arm -->
    <path d="M 230 200 L 170 190 L 140 220" stroke="#ff007f" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Sparkles & Coins -->
  <circle cx="380" cy="120" r="18" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="120" cy="280" r="14" fill="url(#goldGrad)" opacity="0.8" />
  <polygon points="380,105 385,115 395,120 385,125 380,135 375,125 365,120 375,115" fill="#ffffff" />
</svg>
